name: SprechlyWork

options:
  bundleIdPrefix: de.gcng
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KZFCCDV6A8

targets:
  SprechlyWork:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
      - path: DesignSystem
      - path: Features
      - path: Configuration/SprechlyWork.storekit
        buildPhase: none
      - path: Engine
        optional: true
      - path: Transcription
        optional: true
      - path: Persistence
        optional: true
      - path: LiveActivity
      - path: Resources
    dependencies:
      - target: SprechlyWorkWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gcng.sprechly.work
        PRODUCT_NAME: SprechlyWork
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SprechlyWork.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SprechlyWorkTests
      gatherCoverageData: true
      storeKitConfiguration: Configuration/SprechlyWork.storekit
      run:
        environmentVariables:
          - variable: UNLOCK_ALL
            value: "1"
            isEnabled: true

  SprechlyWorkWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
      - path: LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gcng.sprechly.work.widgets
        PRODUCT_NAME: SprechlyWorkWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: NO

  SprechlyWorkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/SprechlyWorkTests
      - path: Configuration/SprechlyWork.storekit
        buildPhase: resources
      # Frozen benchmark audio — see scripts/make_benchmark_fixtures.sh
      - path: Tests/Fixtures/Transcription
        buildPhase: resources
    dependencies:
      - target: SprechlyWork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.gcng.sprechly.work.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SprechlyWork.app/SprechlyWork"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SprechlyWorkUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/SprechlyWorkUITests
    dependencies:
      - target: SprechlyWork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.gcng.sprechly.work.uitests
        TEST_TARGET_NAME: SprechlyWork

schemes:
  Screenshots:
    build:
      targets:
        SprechlyWork: all
        SprechlyWorkUITests: [test]
    test:
      targets:
        - SprechlyWorkUITests
      gatherCoverageData: false
      storeKitConfiguration: Configuration/SprechlyWork.storekit
